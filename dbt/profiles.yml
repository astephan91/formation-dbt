demo_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      # PostgreSQL runs in the `postgres` docker compose service
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'dbt') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dbt') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      threads: 4
      # dbt models will be built under this schema by default
      schema: dbt_arnaud
    prod:
      type: postgres
      # PostgreSQL runs in the `postgres` docker compose service
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'dbt') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dbt') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      threads: 4
      # dbt models will be built under this schema by default
      schema: analytics_prod
